/* ---- キー設定のフォロー ----
   曲名・アーティストが入るたびに推奨キーを出す。
   自分でキーを触った後は、勝手に上書きせず提案だけ残す */
let keyTouched = false;

function updateKeyHint(){
  const hint = document.getElementById('qa-keyhint');
  const title  = document.getElementById('qa-title').value.trim();
  const artist = document.getElementById('qa-artist').value.trim();
  if(!title && !artist){ hint.hidden = true; renderRangeBox(null, ''); return; }

  const sug = suggestKeyFor(title, artist);
  renderRangeBox(title, artist);

  if(!sug.reason || sug.key === qaKey){ hint.hidden = true; }
  else {
    document.getElementById('qa-keywhy').textContent = sug.reason;
    const btn = document.getElementById('qa-keyapply');
    btn.textContent = `${fmtKey(sug.key)} にする`;
    btn.onclick = () => { setQaKey(sug.key); keyTouched = true; updateKeyHint(); };
    hint.hidden = false;
  }

  // まだキーに触れていないうちは、根拠が強いものだけ自動で入れる
  if(!keyTouched && sug.strong && sug.key !== qaKey){ setQaKey(sug.key); hint.hidden = true; }
}

/** 曲の音域と自分の声域を並べて見せる。音域が未知なら手入力を促す */
function renderRangeBox(title, artist){
  const box = document.getElementById('qa-range');
  if(!title){ box.hidden = true; return; }

  const me = myVocalRange();
  if(me.comfortHigh == null){        // 声域が分からなければ比較しようがない
    box.hidden = true; return;
  }
  const song = songRangeOf(title, artist);
  const id = norm(title) + '|' + norm(artist);

  if(!song){
    box.innerHTML = `
      <div class="rb-head">この曲の音域が未登録です</div>
      <p class="rb-note">音域サイトなどで調べた最高音・最低音を入れると、あなたの声域
        （${noteName(me.comfortLow)}〜${noteName(me.comfortHigh)}）に合わせたキーを計算します。</p>
      <div class="rb-in">
        <input type="text" id="qa-rlow"  placeholder="最低音 例）mid1D#" autocomplete="off" spellcheck="false">
        <input type="text" id="qa-rhigh" placeholder="最高音 例）hiA" autocomplete="off" spellcheck="false">
        <button type="button" id="qa-rsave" data-id="${esc(id)}">登録</button>
      </div>
      <span class="rb-msg" id="qa-rmsg"></span>`;
    box.hidden = false;
    return;
  }

  const ra = keyFromRange(title, artist);
  const srcLabel = song.src === 'manual' ? '手入力'
    : `歌唱${song.takes}回ぶんの実測（原曲キー換算）`;
  box.innerHTML = `
    <div class="rb-head">音域の比較<span>${esc(srcLabel)}</span></div>
    <div class="rb-rows">
      <div><span>曲</span><b>${noteName(song.low)} 〜 ${noteName(song.high)}</b><i>${song.high - song.low}半音</i></div>
      <div><span>あなた</span><b>${noteName(me.comfortLow)} 〜 ${noteName(me.comfortHigh)}</b><i>${me.comfortHigh - me.comfortLow}半音</i></div>
      ${ra ? `<div class="${ra.fits ? 'ok' : 'ng'}"><span>${fmtKey(ra.key)}にすると</span><b>${noteName(song.low + ra.key)} 〜 ${noteName(song.high + ra.key)}</b>
        <i>${ra.fits ? '収まります' : `${ra.over}半音はみ出す`}</i></div>` : ''}
    </div>`;
  box.hidden = false;
}

function download(name, content, type){
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doExport(){
  download(`karaoke-memo-${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({ version:1, exportedAt:new Date().toISOString(), songs, history }, null, 2), 'application/json');
  toast('バックアップを書き出しました');
}
function doCsv(){
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = ['曲名,アーティスト,キー,メモ,お気に入り,追加日',
    ...sorted(songs, sortS).map(s => [s.title, s.artist, fmtKey(s.key), s.memo, s.fav ? '★' : '', fmtDate(s.createdAt)].map(q).join(','))
  ].join('\r\n');
  download('karaoke-memo.csv', '﻿' + csv, 'text/csv');   // BOM付きで Excel の文字化けを回避
  toast('CSVを書き出しました');
}
document.getElementById('btn-export').onclick = doExport;
document.getElementById('btn-csv').onclick    = doCsv;
document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!Array.isArray(d.songs)) throw new Error('形式が違います');
      if(!confirm('現在のデータを読み込んだ内容で置き換えます。よろしいですか？')) return;
      songs = d.songs; history = Array.isArray(d.history) ? d.history : [];
      invalidateRangeIndex();
      save(); render(); toast('読み込みました');
    }catch(err){ alert('読み込めませんでした: ' + err.message); }
  };
  rd.readAsText(f); e.target.value = '';
};

/* スクロール／画面幅／ショートカット */
document.getElementById('main').addEventListener('scroll', e => {
  document.getElementById('topbar').classList.toggle('stuck', e.target.scrollTop > 8);
});
MQ.addEventListener('change', e => { isMobile = e.matches; closeSheet(); render(); });
document.addEventListener('keydown', e => {
  if(e.target.matches('input,textarea')) return;
  if(e.key === '/'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key === 'n'){ e.preventDefault(); openSheet(); }
});

attachSwipe(document.getElementById('content'));

render();
detectBackend();  // ローカルサーバー or proxy を検出して自動取得ボタンを有効化
</script>
</body>
</html>
