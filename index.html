<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Karaoke Memo — 歌いたい曲リスト</title>
<style>
:root{
  --bg:#0a0a0f;
  --elev:#13131c;
  --card:#1b1b26;
  --card-hi:#23232f;
  --line:rgba(255,255,255,.08);
  --text:#f3f3f7;
  --muted:#9a9aae;
  --accent:#ff3d81;
  --accent2:#8b5cf6;
  --ok:#3ddc97;
  --radius:14px;
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea{font-size:16px}          /* iOS のフォーカス時ズーム防止 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#33333f;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#4a4a5a;background-clip:padding-box}

/* ================= layout ================= */
.app{
  display:grid;grid-template-columns:236px 1fr;grid-template-rows:1fr auto;
  height:100dvh;gap:8px;padding:8px;padding-bottom:0;
}
.sidebar{background:var(--elev);border-radius:var(--radius);padding:18px 14px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.main{
  background:linear-gradient(180deg,#241733 0,#151520 300px,#101017 100%);
  border-radius:var(--radius);overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;
}
.quickbar{grid-column:1/-1;grid-row:2;padding:10px 4px}

/* ================= sidebar ================= */
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 0;font-weight:800;letter-spacing:.02em}
.brand .disc{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 50%,#0a0a0f 0 22%,var(--accent) 23% 55%,var(--accent2) 56% 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:700;font-size:14px;transition:.15s;text-align:left}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav button.active{color:var(--text);background:rgba(255,255,255,.09)}
.nav .ico{font-size:17px;width:20px;text-align:center}
.side-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.12em;padding:0 12px 8px}
.stats{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.stat b{font-size:19px;color:var(--text);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-foot button{padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);text-align:left;transition:.15s}
.side-foot button:hover{color:var(--text);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.side-foot button.on{color:var(--ok);border-color:rgba(61,220,151,.35)}

/* ================= main header ================= */
.topbar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:14px 26px;backdrop-filter:blur(14px);background:rgba(12,12,18,.55);
  border-bottom:1px solid transparent;transition:.2s;
}
.topbar.stuck{border-bottom-color:var(--line);background:rgba(12,12,18,.88)}
.search{position:relative;flex:1;max-width:380px}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);outline:none;font-size:14px}
.search input:focus{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.chip.on{background:var(--text);color:#0a0a0f;border-color:var(--text)}
.spacer{flex:1}

.hero{padding:14px 26px 6px}
.hero h1{margin:0;font-size:clamp(26px,4vw,44px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:8px 0 0;color:var(--muted);font-size:13px}
.content{padding:16px 26px 40px}
.sortbar{display:none;gap:8px;padding:0 16px 4px;overflow-x:auto;scrollbar-width:none}
.sortbar::-webkit-scrollbar{display:none}

/* ================= table (desktop) ================= */
table{width:100%;border-collapse:collapse}
thead th{
  position:sticky;top:56px;z-index:4;background:rgba(14,14,20,.92);backdrop-filter:blur(10px);
  text-align:left;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;
}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--text)}
thead th .arw{opacity:0;margin-left:4px;font-size:10px}
thead th.act{color:var(--text)}
thead th.act .arw{opacity:1;color:var(--accent)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.055)}
tbody td{padding:10px 12px;font-size:14px;vertical-align:middle}
.c-num{width:44px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.c-fav{width:44px}
.c-key{width:88px}
.c-date{width:110px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.c-act{width:96px;text-align:right;white-space:nowrap}
.title-cell{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{width:40px;height:40px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.t-main{min-width:0}
.t-main .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-main .ts{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.artist-cell{color:var(--muted);font-size:13.5px}
.artist-cell b{color:var(--text);font-weight:600}
.keytag{display:inline-block;min-width:46px;text-align:center;padding:4px 9px;border-radius:7px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.keytag.up{background:rgba(255,61,129,.16);border-color:rgba(255,61,129,.4);color:#ff8fb5}
.keytag.down{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.38);color:#93c5fd}
.fav{font-size:16px;color:#3f3f4d;transition:.15s}
.fav:hover{color:#8b8b9e}
.fav.on{color:var(--accent)}
.rowbtn{padding:5px 9px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid transparent;transition:.15s}
tbody tr:hover .rowbtn{border-color:var(--line)}
.rowbtn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.rowbtn.danger:hover{color:#ff6b81;background:rgba(255,61,129,.14)}
.rowbtn.add{color:var(--ok);border-color:rgba(61,220,151,.3)}
.rowbtn.add:hover{background:rgba(61,220,151,.14)}
.memo-cell{color:var(--muted);font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-in{font-size:11px;color:var(--ok);font-weight:700}
.mchip{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.35);color:#c4b5fd;margin:2px 4px 0 0;white-space:nowrap}
.rawline{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.dam-fetch-msg{color:var(--muted);font-size:12px;flex:1;min-width:0}
/* ---- 採点の詳細ダイアログ ---- */
.hd-head{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.hd-head .thumb{width:48px;height:48px;border-radius:9px;font-size:18px}
.hd-artist{font-size:13.5px;color:var(--muted);font-weight:600}
.hd-sum{font-size:12px;color:var(--muted);margin-top:3px}
.take{border:1px solid var(--line);border-radius:11px;padding:13px;background:rgba(0,0,0,.24)}
.take-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.take-date{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.take-score{margin-left:auto;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.take-score small{font-size:12px;font-weight:800;margin-left:2px}
.take-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.take-meta .keychip{color:var(--text);font-weight:800;padding:1px 9px;border-radius:999px;background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4)}
.take-sub{font-size:11.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
[data-hkey]{cursor:pointer}

/* ---- 歌唱の一覧（曲を選んだ直後） ---- */
.takelist{display:flex;flex-direction:column;gap:7px}
.takeitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.24);transition:.15s}
.takeitem:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.takeitem:active{transform:scale(.99)}
.ti-date{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ti-key{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);white-space:nowrap}
.ti-score{margin-left:auto;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.ti-arw{color:var(--muted);font-size:17px;flex:none}
#h-body .backchip{margin-bottom:2px;align-self:flex-start}

.sec{margin-top:14px}
.sec.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sech{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;margin-bottom:7px}
.sech b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.sech span{font-size:10.5px;font-weight:600;color:var(--muted)}
.sub{min-width:0}
.subh{font-size:11.5px;font-weight:800;margin-bottom:6px}
.subh b{color:var(--accent);font-variant-numeric:tabular-nums}
.subrow{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:4px}
.subrow.dim{color:var(--muted);font-variant-numeric:tabular-nums}

/* レーダーチャート */
.radar-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.radar{width:100%;max-width:340px;height:auto}
.radar .rw{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1}
.radar .rme{fill:rgba(255,61,129,.3);stroke:var(--accent);stroke-width:2}
.radar .ravg{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.4;stroke-dasharray:3 3}
.radar .rl{fill:#9a9aae;font-size:8.5px;font-weight:700}
.radar .rv{fill:#f3f3f7;font-size:10.5px;font-weight:800}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:14px;height:0;border-top:2px solid var(--accent);display:inline-block}
.legend i.avg{border-top:2px dashed rgba(255,255,255,.5);margin-left:10px}

/* 区間グラフ */
.sgraph{display:flex;align-items:flex-end;gap:2px;height:74px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.sgraph .sbar{flex:1;min-width:0;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#8bd3ff,#3b82f6)}
.sgraph .sbar.sabi{background:linear-gradient(180deg,#ffc46b,#f97316)}
.sgraph.hear .sbar{background:linear-gradient(180deg,#ff9ec4,#ff3d81)}
.sgraph.hear .sbar.sabi{background:linear-gradient(180deg,#ffd1e4,#ff1f6d)}
.sgraph .sgap{flex:1;min-width:0;height:2px;background:rgba(255,255,255,.1);border-radius:2px}

/* メーター */
.meter{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);white-space:nowrap}
.mtrack{position:relative;flex:1;min-width:40px;height:6px;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#2d2d3d,var(--accent))}
.mtrack i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(0,0,0,.5)}

/* 上手さのひし形 */
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;background:#3a3a48;transform:rotate(45deg);border-radius:1px}
.dots i.on{background:linear-gradient(135deg,#7ee8c6,var(--ok))}
.dnum{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 声域の鍵盤 */
.kbd{position:relative;height:46px;border-radius:5px;overflow:hidden;background:#15151d;border:1px solid var(--line)}
.kbd .wk{position:absolute;top:0;bottom:0;background:#e9e9f0;border-right:1px solid #b9b9c8}
.kbd .wk.in{background:linear-gradient(180deg,#fff,#ffd7e6)}
.kbd .wk.edge{background:linear-gradient(180deg,#fff,var(--accent))}
.kbd .bk{position:absolute;top:0;height:60%;background:#1c1c26;border-radius:0 0 2px 2px;z-index:2}
.kbd .bk.in{background:#7a2545}
.kbd .bk.edge{background:var(--accent)}
.kbd-lab{margin-top:6px;font-size:11.5px;color:var(--muted)}
.kbd-lab b{color:var(--text);font-variant-numeric:tabular-nums}

/* 表現力などの回数 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.cchip b{font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---- 声域分析 ---- */
.voice{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.vcell{flex:1 1 116px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vcell span{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.vcell b{font-size:19px;font-variant-numeric:tabular-nums}
.vcell.wide{flex:1 1 100%}
.keyhint{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:11.5px;color:var(--muted)}
.keyhint button{flex:none;padding:4px 11px;border-radius:999px;border:1px solid rgba(61,220,151,.4);color:var(--ok);font-size:11px;font-weight:800}
.keyhint button:hover{background:rgba(61,220,151,.13)}
.keyhint .why{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- 曲の音域とのすり合わせ ---- */
.rangebox{margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.28)}
.rb-head{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:800;margin-bottom:6px}
.rb-head span{font-size:10px;font-weight:600;color:var(--muted)}
.rb-note{margin:0 0 8px;font-size:10.5px;line-height:1.7;color:var(--muted)}
.rb-rows{display:flex;flex-direction:column;gap:4px}
.rb-rows > div{display:flex;align-items:baseline;gap:8px;font-size:11.5px}
.rb-rows span{flex:none;width:82px;color:var(--muted);font-weight:700}
.rb-rows b{font-variant-numeric:tabular-nums;font-size:12.5px}
.rb-rows i{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--muted)}
.rb-rows .ok b,.rb-rows .ok i{color:var(--ok)}
.rb-rows .ng b,.rb-rows .ng i{color:#ff8fb5}
.rb-in{display:flex;gap:6px;flex-wrap:wrap}
.rb-in input{flex:1 1 110px;min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);outline:none;font-size:12px}
.rb-in input:focus{border-color:var(--accent2)}
.rb-in button{flex:none;padding:7px 14px;border-radius:8px;font-size:11.5px;font-weight:800;background:rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.5)}
.rb-msg{display:block;margin-top:6px;font-size:10.5px;color:#ff8fb5}

/* ---- 取得バー（連携済みのとき常に上に出る） ---- */
.syncbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.syncbar .btn.big{padding:12px 22px;font-size:14px}
.syncinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.syncinfo b{font-size:13px;font-variant-numeric:tabular-nums}
.syncinfo span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.syncbar .dam-fetch-msg{flex:1 1 100%;margin:0}

.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.modebar .chip{display:inline-flex;align-items:center;gap:7px}
.modebar .cnt{font-size:10.5px;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.1);color:inherit}
.modebar .chip.on .cnt{background:rgba(0,0,0,.16)}
.warnbox{margin:0 0 12px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.85;color:#ffc9d8;background:rgba(255,61,129,.09);border:1px solid rgba(255,61,129,.32)}
.warnbox b{color:#fff}

/* ================= card rows (mobile) ================= */
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.mrow:active{background:rgba(255,255,255,.06)}
.mrow .thumb{width:46px;height:46px;border-radius:8px}
.mbody{flex:1;min-width:0}
.mbody .tt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbody .ts{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.mtail{display:flex;align-items:center;gap:4px;flex:none}
.mtail .fav{font-size:19px;width:38px;height:38px;display:grid;place-items:center}
.mtail .addb{width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--ok);border:1px solid rgba(61,220,151,.35);display:grid;place-items:center}
.mtail .done{font-size:16px;color:var(--ok);width:38px;text-align:center}

/* ---- 左スワイプで削除（モバイルのマイメモ） ---- */
.swipe{overflow:hidden;border-bottom:1px solid rgba(255,255,255,.05)}
.swipe .mrow{flex:1 0 100%;min-width:0;border-bottom:none}
.swipe-inner{display:flex;align-items:stretch;width:100%;transform:translateX(0);transition:transform .22s cubic-bezier(.2,.85,.25,1)}
.swipe.dragging .swipe-inner{transition:none}
.swipe.open .swipe-inner{transform:translateX(-92px)}
.swipe-del{
  flex:0 0 92px;display:grid;place-items:center;gap:2px;align-content:center;
  background:linear-gradient(135deg,#ff3d81,#c2185b);color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em;
}
.swipe-del .di{font-size:17px;line-height:1}
.swipe-del:active{filter:brightness(.9)}

/* ---- アーティスト絞り込み中のヘッダ ---- */
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.filterbar .cur{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;min-width:0}
.filterbar .cur .thumb{width:28px;height:28px;border-radius:50%;font-size:12px}
.filterbar .cur span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backchip{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;transition:.15s}
.backchip:hover{color:var(--text);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
.backchip.main{color:var(--text);border-color:rgba(255,255,255,.22)}

/* ================= artist cards ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.acard{background:var(--card);border-radius:10px;padding:14px;transition:.18s;cursor:pointer;border:1px solid transparent}
.acard:hover{background:var(--card-hi);border-color:var(--line);transform:translateY(-2px)}
.acard .art{width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:12px;display:grid;place-items:center;font-size:34px;font-weight:900;color:rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.acard .an{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ac{font-size:12px;color:var(--muted);margin-top:4px}

/* ================= panels ================= */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px}
.panel h3{margin:0 0 6px;font-size:15px}
.panel .note{color:var(--muted);font-size:12.5px;line-height:1.75;margin:0 0 12px}
.panel-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:800;transition:.15s;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:none}
.btn.danger{color:#ff6b81;background:none;border-color:rgba(255,107,129,.3)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.dam-in{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);outline:none;font-size:14px}
.dam-in:focus{border-color:var(--accent)}
.inrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.inrow .dam-in{flex:1;min-width:150px}
.setbox{margin:6px 0 4px;padding:14px;border:1px dashed rgba(255,255,255,.16);border-radius:10px;background:rgba(139,92,246,.05)}
.damid{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:14px}
.damid .dl{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.damid b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.02em;word-break:break-all}
.panel code{background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px;font-size:11.5px;word-break:break-all}

/* ================= quick add / sheet ================= */
.qa{display:flex;align-items:center;gap:12px;background:var(--elev);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.qa .handle{display:none}
.qa .disc2{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#0a0a0f 0 20%,#2d2d3d 21% 100%);display:grid;place-items:center;font-size:19px;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qa .fields{display:flex;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.qa input[type=text]{width:100%;padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);outline:none;font-size:14px;min-width:0}
.qa input[type=text]:focus{border-color:var(--accent);background:rgba(255,255,255,.09)}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.05);flex:none}
.stepper button{width:34px;height:40px;font-size:17px;font-weight:800;color:var(--muted);border-radius:8px}
.stepper button:active{color:var(--text);background:rgba(255,255,255,.12)}
.stepper .val{min-width:54px;text-align:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.qa .lbl{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.1em;margin-bottom:4px;display:block}
.qa .group{display:flex;flex-direction:column;min-width:0}

/* ================= suggestions ================= */
.sugwrap{position:relative;min-width:0}
.suglist{
  position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:80;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.65);overflow-y:auto;max-height:300px;display:none;
}
.suglist.down{top:calc(100% + 6px);bottom:auto}
.suglist.on{display:block}
.sugitem{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.sugitem:last-child{border-bottom:none}
.sugitem.active,.sugitem:hover{background:rgba(255,255,255,.09)}
.sugitem .thumb{width:34px;height:34px;border-radius:6px;font-size:13px}
.sugitem .sm{min-width:0;flex:1}
.sugitem .s1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugitem .s2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sugitem mark{background:none;color:var(--accent);font-weight:800}
.sugsrc{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;flex:none;border:1px solid var(--line);color:var(--muted)}
.sugsrc.local{color:var(--ok);border-color:rgba(61,220,151,.3)}
.sughead{padding:7px 12px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);background:rgba(0,0,0,.25)}

/* ================= mobile chrome ================= */
.tabbar,.fab,.scrim{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}

/* ================= misc ================= */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:14px;opacity:.55}
.empty h3{color:var(--text);margin:0 0 8px;font-size:17px}
.empty p{margin:0 0 18px;font-size:13px;line-height:1.8}
dialog{border:1px solid var(--line);background:var(--elev);color:var(--text);border-radius:16px;padding:0;width:min(460px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
#hdlg{width:min(600px,94vw);max-height:88dvh}
/* dialog は閉じている間 display:none が効いている必要があるので、開いている時だけ上書きする */
#hdlg[open]{display:flex;flex-direction:column}
#hdlg .dlg-b{overflow-y:auto;gap:16px}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.dlg-h{padding:20px 22px 0;font-size:17px;font-weight:800}
.dlg-b{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);outline:none;font-size:15px}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.dlg-f{padding:0 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-f .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);z-index:99;background:#f3f3f7;color:#0a0a0f;padding:11px 22px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center;display:flex;align-items:center;gap:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast #toast-msg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 親が pointer-events:none でも、このボタンだけは押せるようにする */
.toast-act{pointer-events:auto;flex:none;margin:-4px -12px -4px 0;padding:7px 14px;border-radius:999px;background:#0a0a0f;color:#f3f3f7;font-size:12px;font-weight:800;letter-spacing:.02em}
.toast-act:active{opacity:.72}
.toast-act[hidden]{display:none}

/* =========================================================
   MOBILE  (<=860px)
   ========================================================= */
@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr;gap:0;padding:6px;padding-bottom:0}
  .sidebar{display:none}
  .main{border-radius:12px}
  .topbar{padding:10px 14px;gap:8px}
  .hero{padding:10px 16px 2px}
  .hero h1{font-size:25px}
  .hero p{font-size:12px;margin-top:5px}
  .content{padding:10px 16px calc(var(--tabh) + 46px + env(safe-area-inset-bottom))}
  .sortbar{display:flex}
  .sortbar .chip{padding:6px 12px;font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
  .acard{padding:0;background:none}
  .acard .art{margin-bottom:8px;font-size:26px;box-shadow:0 5px 14px rgba(0,0,0,.4)}
  .acard .an{font-size:12.5px}
  .acard .ac{font-size:11px}
  .panel{padding:14px}

  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(12,12,18,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabh);font-size:10px;font-weight:800;color:var(--muted)}
  .tabbar button .ti{font-size:18px;line-height:1}
  .tabbar button.active{color:var(--accent)}
  .fab{
    display:grid;place-items:center;position:fixed;right:16px;
    bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:45;
    width:56px;height:56px;border-radius:50%;font-size:27px;font-weight:300;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(255,61,129,.42);transition:transform .18s;
  }
  .fab:active{transform:scale(.9)}
  .scrim{display:block}

  /* クイック追加バー → ボトムシート化 */
  .quickbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;padding:0;
    transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.85,.25,1);
  }
  .quickbar.open{transform:none}
  .qa{
    flex-direction:column;align-items:stretch;gap:13px;
    border-radius:20px 20px 0 0;border-bottom:none;
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:88dvh;overflow-y:auto;
  }
  .qa .handle{display:block;width:40px;height:4px;border-radius:2px;background:#3a3a48;margin:2px auto 6px;flex:none}
  .qa .disc2{display:none}
  .qa .fields{flex-direction:column;gap:13px;flex:none}
  .qa .group{flex:none !important;width:100%}
  .qa .group.keywrap .keyrow{display:flex;flex-direction:row;align-items:center;justify-content:space-between}
  .qa .group.keywrap .keyrow .lbl{margin:0}
  .qa .btn.primary{width:100%;padding:14px;font-size:15px;border-radius:12px}
  .suglist{max-height:44dvh}

  dialog{width:100vw;max-width:100vw;margin:0 auto;position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:20px 20px 0 0;border-bottom:none;max-height:92dvh;overflow-y:auto}
  #hdlg{width:100vw;max-height:94dvh}
  .sec.twocol{grid-template-columns:1fr}
  .take-score{font-size:26px}
  .dlg-f{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .dlg-f .btn{flex:1;text-align:center;padding:13px}
  .dlg-f .left{flex:0 0 100%;margin-right:0;order:9}
  .toast{bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="disc"></div>
      <div>Karaoke Memo<small>SONG STOCK</small></div>
    </div>

    <nav class="nav" id="nav">
      <button data-view="memo" class="active"><span class="ico">♪</span>マイメモ</button>
      <button data-view="artist"><span class="ico">◎</span>アーティスト</button>
      <button data-view="history"><span class="ico">⟲</span>歌唱履歴（DAM★とも）</button>
    </nav>

    <div>
      <div class="side-title">ライブラリ</div>
      <div class="stats">
        <div class="stat"><span>登録曲</span><b id="st-songs">0</b></div>
        <div class="stat"><span>お気に入り</span><b id="st-fav">0</b></div>
        <div class="stat"><span>アーティスト</span><b id="st-artists">0</b></div>
        <div class="stat"><span>履歴レコード</span><b id="st-hist">0</b></div>
      </div>
    </div>

    <div class="side-foot">
      <button id="btn-online">◌　オンライン候補：OFF</button>
      <button id="btn-export">⤓　バックアップを書き出す</button>
      <button id="btn-import">⤒　バックアップを読み込む</button>
      <button id="btn-csv">▤　メモをCSVで書き出す</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <div class="search">
        <span class="mag">⌕</span>
        <input type="text" id="q" placeholder="曲名・アーティストで検索">
      </div>
      <button class="chip" id="chip-fav">★</button>
      <div class="spacer"></div>
    </div>

    <div class="hero">
      <h1 id="hero-t">マイメモ</h1>
      <p id="hero-s"></p>
    </div>

    <div class="sortbar" id="sortbar"></div>
    <div class="content" id="content"></div>
  </main>

  <!-- ============ QUICK ADD (desktop bar / mobile sheet) ============ -->
  <div class="quickbar" id="quickbar">
    <div class="qa">
      <div class="handle" id="sheet-handle"></div>
      <div class="disc2">🎤</div>
      <div class="fields">
        <div class="group" style="flex:2 1 210px">
          <span class="lbl">曲名</span>
          <div class="sugwrap"><input type="text" id="qa-title" placeholder="入力すると候補が出ます" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        </div>
        <div class="group" style="flex:1.6 1 170px">
          <span class="lbl">アーティスト</span>
          <div class="sugwrap"><input type="text" id="qa-artist" placeholder="例）YOASOBI" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        </div>
        <div class="group keywrap">
          <div class="keyrow">
            <span class="lbl">キー</span>
            <div class="stepper">
              <button id="qa-minus" aria-label="キーを下げる">−</button>
              <div class="val" id="qa-keyval">±0</div>
              <button id="qa-plus" aria-label="キーを上げる">＋</button>
            </div>
          </div>
          <div class="keyhint" id="qa-keyhint" hidden>
            <span class="why" id="qa-keywhy"></span>
            <button type="button" id="qa-keyapply"></button>
          </div>
          <div class="rangebox" id="qa-range" hidden></div>
        </div>
        <div class="group" style="flex:1.2 1 140px">
          <span class="lbl">メモ</span>
          <input type="text" id="qa-memo" placeholder="サビが高い / 練習中 など" autocomplete="off">
        </div>
      </div>
      <button class="btn primary" id="qa-save" style="flex:none">＋ 追加</button>
    </div>
  </div>
</div>

<!-- ============ MOBILE CHROME ============ -->
<div class="scrim" id="scrim"></div>
<button class="fab" id="fab" aria-label="曲を追加">＋</button>
<nav class="tabbar" id="tabbar">
  <button data-view="memo" class="active"><span class="ti">♪</span>マイメモ</button>
  <button data-view="artist"><span class="ti">◎</span>アーティスト</button>
  <button data-view="history"><span class="ti">⟲</span>履歴</button>
  <button data-view="more"><span class="ti">≡</span>その他</button>
</nav>

<!-- ============ EDIT DIALOG ============ -->
<dialog id="dlg">
  <div class="dlg-h">メモを編集</div>
  <div class="dlg-b">
    <div class="field"><label>曲名</label><div class="sugwrap"><input type="text" id="d-title" autocomplete="off"></div></div>
    <div class="field"><label>アーティスト</label><div class="sugwrap"><input type="text" id="d-artist" autocomplete="off"></div></div>
    <div class="field">
      <label>キー</label>
      <div class="stepper" style="width:fit-content">
        <button id="d-minus">−</button><div class="val" id="d-keyval">±0</div><button id="d-plus">＋</button>
      </div>
    </div>
    <div class="field"><label>メモ</label><textarea id="d-memo" placeholder="キー調整のコツ、歌いにくい箇所など"></textarea></div>
  </div>
  <div class="dlg-f">
    <button class="btn danger left" id="d-del">削除</button>
    <button class="btn ghost" id="d-cancel">キャンセル</button>
    <button class="btn primary" id="d-save">保存</button>
  </div>
</dialog>

<!-- ============ HISTORY DETAIL DIALOG ============ -->
<dialog id="hdlg">
  <div class="dlg-h" id="h-title">採点の詳細</div>
  <div class="dlg-b" id="h-body"></div>
  <div class="dlg-f">
    <button class="btn primary left" id="h-tomemo">＋ マイメモへ追加</button>
    <button class="btn ghost" id="h-close">閉じる</button>
  </div>
</dialog>

<div class="toast" id="toast">
  <span id="toast-msg"></span>
  <button class="toast-act" id="toast-act" hidden></button>
</div>

<script>
/* =========================================================
   Karaoke Memo — 単一HTML / localStorage 保存
   ========================================================= */
const LS_SONGS  = 'karaokeMemo.songs.v1';
const LS_HIST   = 'karaokeMemo.history.v1';
const LS_ONLINE = 'karaokeMemo.online.v1';
const LS_DAM    = 'karaokeMemo.dam.v1';        // DAM★ともアカウント { damtomoId, cardNo }
const LS_DAMENC = 'karaokeMemo.damEnc.v1';     // 廃止: 旧パスワード保護（起動時に掃除する）
const LS_PROXY  = 'karaokeMemo.proxy.v1';      // 取得proxy(Cloudflare Worker等)のURL
const LS_HMODE  = 'karaokeMemo.histMode.v1';   // 歌唱履歴で選んでいる採点種別
const LS_FETCH  = 'karaokeMemo.lastFetch.v1';  // 最後に自動取得した時刻
const LS_RANGES = 'karaokeMemo.songRanges.v1'; // 手入力した曲の音域 { "曲|歌手": {high,low} }
const FETCH_LABEL = '⟳ 精密採点履歴を取得';
// ▼ 共有Worker(Cloudflare)のURL。設定済みなので配布相手は設定不要でボタン取得できます。
//   変更する場合はここを差し替えてください（末尾スラッシュ無し）。
const DEFAULT_PROXY = 'https://karaoke-memo.kupe0121.workers.dev';
// 過去に既定として配ったが、実体が無かったURL。保存されていたら捨てて既定に戻す
const RETIRED_PROXIES = ['https://karaoke-proxy.kupe0121.workers.dev'];

let songs   = load(LS_SONGS, []);
let history = load(LS_HIST, []);
let online  = load(LS_ONLINE, false);
let backendMode = 'none';              // 'local'(server.js) | 'proxy'(Worker等) | 'none'
let proxyAlive  = null;                // proxyの疎通確認: null=未確認 / true / false
let proxyUrl    = load(LS_PROXY, '');                    // 取得proxyのURL（保存が無ければ既定を使用）
if(RETIRED_PROXIES.includes(proxyUrl)){ localStorage.removeItem(LS_PROXY); proxyUrl = ''; }
proxyUrl = proxyUrl || DEFAULT_PROXY;

let dam = load(LS_DAM, null);          // 連携中のアカウント { damtomoId, cardNo } or null
let lastFetch = load(LS_FETCH, null);  // 最後に自動取得した時刻(ms)
let songRanges = load(LS_RANGES, {});  // 手入力した曲の音域
// パスワード保護は廃止。復号できない残骸を持ち続けても意味がないので捨てる
if(localStorage.getItem(LS_DAMENC)) localStorage.removeItem(LS_DAMENC);

/* 採点種別。DAM側の mode 文字列をそのまま使う */
const MODE_ORDER = ['精密採点AiHeart', '精密採点Ai', '精密採点DX-G'];
let histMode = load(LS_HMODE, 'all');  // 'all' または MODE_ORDER のいずれか

let view    = 'memo';
let query   = '';
let favOnly = false;
let artistFilter = null;               // アーティストを選んで絞り込み中のとき、その名前
let sortS   = { key:'createdAt', dir:'desc' };
let sortH   = { key:'lastAt',    dir:'desc' };
let qaKey   = 0;
let dKey    = 0;
let editing = null;

/* ---------------- utils ---------------- */
function load(k, def){ try{ const v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; }catch{ return def; } }
/**
 * 容量超過で1つ失敗しても、他まで巻き添えにしない。
 * 履歴は採点の内訳を含めて数百KBになるため、軽くて大事なものから先に書く。
 */
let storageFull = false;
function save(){
  const items = [
    [LS_DAM,    dam],           // アカウントは最優先（消えると再登録が必要になる）
    [LS_ONLINE, online],
    [LS_RANGES, songRanges],
    [LS_SONGS,  songs],
    [LS_HIST,   history],       // いちばん重い。溢れるならここ
  ];
  let failed = null;
  for(const [k, v] of items){
    if(v == null) continue;
    try{ localStorage.setItem(k, JSON.stringify(v)); }
    catch(err){ failed = k; }
  }
  const wasFull = storageFull;
  storageFull = failed !== null;
  if(storageFull && !wasFull){
    toast(failed === LS_HIST
      ? '保存容量が足りず、歌唱履歴を保存できませんでした'
      : '保存容量が足りません');
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtKey(k){ const n = Number(k) || 0; return n === 0 ? '±0' : (n > 0 ? '+'+n : String(n)); }
function keyCls(k){ const n = Number(k) || 0; return n > 0 ? 'up' : (n < 0 ? 'down' : ''); }
function fmtDate(ms){ if(!ms) return '—'; const d = new Date(ms); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
function fmtDateTime(ms){
  if(!ms) return '—';
  const d = new Date(ms);
  return `${fmtDate(ms)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function norm(s){ return String(s ?? '').trim().toLowerCase().replace(/[\s　]+/g,''); }
function hue(str){ let h = 0; for(const c of String(str)) h = (h*31 + c.codePointAt(0)) % 360; return h; }
function thumbStyle(seed){ const h = hue(seed); return `background:linear-gradient(135deg,hsl(${h} 68% 46%),hsl(${(h+52)%360} 66% 34%))`; }
function initial(s){ return (String(s || '?').trim()[0] || '?').toUpperCase(); }

let toastTimer;
/**
 * トースト表示。action を渡すと数秒間ボタン付きで出る
 * action: { label, run, ms }
 */
function toast(msg, action){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;

  const b = document.getElementById('toast-act');
  if(action){
    b.textContent = action.label;
    b.hidden = false;
    b.onclick = () => { hideToast(); action.run(); };
  } else {
    b.hidden = true; b.onclick = null;
  }

  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? (action.ms || 6000) : 2000);
}
function hideToast(){ clearTimeout(toastTimer); document.getElementById('toast').classList.remove('show'); }

function cmpVal(va, vb){
  if(typeof va === 'number' && typeof vb === 'number') return va - vb;
  return String(va).localeCompare(String(vb), 'ja');
}
function sorted(arr, st){
  const dir = st.dir === 'desc' ? -1 : 1;
  return [...arr].sort((a, b) => {
    const va = a[st.key], vb = b[st.key];
    const na = va === '' || va == null, nb = vb === '' || vb == null;
    if(na && nb) return 0;
    if(na) return 1;                 // 空欄は昇順/降順どちらでも末尾へ
    if(nb) return -1;
    return dir * cmpVal(va, vb);
  });
}
function toggleSort(st, key, defDir){
  if(st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
  else { st.key = key; st.dir = defDir || 'asc'; }
  render();
}

/* =========================================================
   候補（サジェスト）
   ========================================================= */
const onlineCache = new Map();
let onlineAbort = null;

/** 手持ちデータ（メモ＋DAM履歴）から曲名・アーティストの候補を作る */
function localCatalog(){
  const map = new Map();
  for(const s of [...songs, ...history]){
    if(!s.title) continue;
    const k = norm(s.title) + '|' + norm(s.artist);
    if(!map.has(k)) map.set(k, { title:s.title, artist:s.artist || '', src:'local' });
  }
  return [...map.values()];
}

function localArtists(){
  const map = new Map();
  for(const s of [...songs, ...history]){
    if(!s.artist) continue;
    const k = norm(s.artist);
    if(!map.has(k)) map.set(k, { title:s.artist, artist:'', src:'local', isArtist:true });
  }
  return [...map.values()];
}

async function fetchOnline(term, mode, signal){
  const ck = mode + '::' + term;
  if(onlineCache.has(ck)) return onlineCache.get(ck);
  const entity = mode === 'artist' ? 'musicArtist' : 'song';
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&country=JP&media=music&entity=${entity}&limit=12`;
  const res = await fetch(url, { signal });
  if(!res.ok) throw new Error('search failed');
  const data = await res.json();
  const items = (data.results || []).map(r => mode === 'artist'
    ? { title:r.artistName, artist:'', src:'online', isArtist:true }
    : { title:r.trackName, artist:r.artistName, art:r.artworkUrl60, src:'online' }
  ).filter(x => x.title);
  onlineCache.set(ck, items);
  return items;
}

function highlight(text, term){
  const t = String(text ?? '');
  if(!term) return esc(t);
  const i = norm(t).indexOf(norm(term));
  if(i < 0) return esc(t);
  // norm() は空白を落とすため位置がずれうる。単純な大小無視検索でフォールバック。
  const j = t.toLowerCase().indexOf(term.toLowerCase());
  if(j < 0) return esc(t);
  return esc(t.slice(0, j)) + '<mark>' + esc(t.slice(j, j + term.length)) + '</mark>' + esc(t.slice(j + term.length));
}

/**
 * 入力欄に候補ドロップダウンを付ける
 * mode: 'title' | 'artist'
 * partner: 曲名を選んだときに埋めるアーティスト欄（任意）
 */
function attachSuggest(input, mode, partner){
  const wrap = input.parentElement;
  const list = document.createElement('div');
  list.className = 'suglist';
  wrap.appendChild(list);

  let items = [], active = -1, timer = null, open = false;

  function close(){ open = false; active = -1; list.classList.remove('on'); }

  function place(){
    const r = input.getBoundingClientRect();
    const below = window.innerHeight - r.bottom;
    list.classList.toggle('down', below > 260 || below > r.top);
  }

  function draw(term, loading){
    if(!items.length && !loading){ close(); return; }
    const rows = items.map((it, i) => `
      <div class="sugitem ${i === active ? 'active' : ''}" data-i="${i}">
        <div class="thumb" style="${thumbStyle(it.artist || it.title)}">
          ${it.art ? `<img src="${esc(it.art)}" alt="" loading="lazy">` : esc(initial(it.artist || it.title))}
        </div>
        <div class="sm">
          <div class="s1">${highlight(it.title, term)}</div>
          ${it.artist ? `<div class="s2">${esc(it.artist)}</div>` : (it.isArtist ? '<div class="s2">アーティスト</div>' : '')}
        </div>
        <span class="sugsrc ${it.src}">${it.src === 'local' ? '保存済' : 'ONLINE'}</span>
      </div>`).join('');
    list.innerHTML = rows + (loading ? '<div class="sughead">オンライン候補を検索中…</div>' : '');
    place();
    list.classList.add('on');
    open = true;
  }

  function pick(i){
    const it = items[i]; if(!it) return;
    if(mode === 'title'){
      input.value = it.title;
      if(partner && it.artist && !partner.value.trim()) partner.value = it.artist;
    } else {
      input.value = it.title;
    }
    close();
    input.dispatchEvent(new Event('change'));
  }

  async function run(){
    const term = input.value.trim();
    if(term.length < 1){ items = []; close(); return; }

    const pool = mode === 'artist' ? localArtists() : localCatalog();
    const n = norm(term);
    items = pool.filter(x => norm(x.title).includes(n) || norm(x.artist).includes(n)).slice(0, 8);
    active = -1;
    draw(term, online && term.length >= 2);

    if(!online || term.length < 2) return;
    try{
      if(onlineAbort) onlineAbort.abort();
      onlineAbort = new AbortController();
      const found = await fetchOnline(term, mode, onlineAbort.signal);
      if(input.value.trim() !== term) return;          // 入力が変わっていたら破棄
      const seen = new Set(items.map(x => norm(x.title) + '|' + norm(x.artist)));
      for(const f of found){
        const k = norm(f.title) + '|' + norm(f.artist);
        if(seen.has(k)) continue;
        seen.add(k); items.push(f);
      }
      items = items.slice(0, 16);
      draw(term, false);
    }catch(err){
      if(err.name !== 'AbortError') draw(term, false);
    }
  }

  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, online ? 260 : 60); });
  input.addEventListener('focus', () => { if(input.value.trim()) run(); });
  input.addEventListener('blur', () => setTimeout(close, 180));

  // 上下キー・Enter・Esc。処理したキーは後続リスナー（Enterで保存）へ渡さない
  input.addEventListener('keydown', e => {
    if(!open || !items.length) return;
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); e.stopImmediatePropagation();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      draw(input.value.trim(), false);
      list.querySelector('.sugitem.active')?.scrollIntoView({ block:'nearest' });
    } else if(e.key === 'Enter' && active >= 0){
      e.preventDefault(); e.stopImmediatePropagation();
      pick(active);
    } else if(e.key === 'Escape'){
      e.preventDefault(); e.stopImmediatePropagation();
      close();
    }
  });

  list.addEventListener('mousedown', e => e.preventDefault());   // blur を防ぐ
  list.addEventListener('click', e => {
    const it = e.target.closest('.sugitem'); if(!it) return;
    pick(Number(it.dataset.i));
  });
}

/* =========================================================
   DAM★とも アカウント
   damtomoId は会員番号（CDMカード番号）を Base64 したもの。
   例）MTIzNDU2Nzg5 → 123456789
   ========================================================= */
/** URL / damtomoId / 会員番号 のいずれを渡しても {cardNo, damtomoId} を返す */
function parseDamId(input){
  let s = String(input || '').trim();
  if(!s) return null;
  const m = s.match(/damtomoId=([A-Za-z0-9+/=]+)/i);
  if(m) s = m[1];
  s = s.replace(/\s/g,'');

  if(/^\d{5,15}$/.test(s)){                          // 会員番号を直接入力された場合
    try{ return { cardNo:s, damtomoId: btoa(s) }; }catch{ return null; }
  }
  if(/^[A-Za-z0-9+/]{8,32}={0,2}$/.test(s)){         // damtomoId（会員番号のBase64）
    let cardNo = '';
    try{ const d = atob(s); if(/^\d{5,20}$/.test(d)) cardNo = d; }catch{}
    return { cardNo, damtomoId:s };                  // デコードできなくてもIDとして受け付ける
  }
  return null;
}
/* =========================================================
   歌唱履歴の集計
   ========================================================= */
/** 採点種別で絞った履歴レコード（histMode が 'all' なら全件） */
function histRecords(mode = histMode){
  return mode === 'all' ? history : history.filter(r => r.mode === mode);
}

/** 実際に取り込まれている採点種別を、既定の並び順で返す */
function histModes(){
  const seen = new Set(history.map(r => r.mode).filter(Boolean));
  const ordered = MODE_ORDER.filter(m => seen.has(m));
  for(const m of seen) if(!ordered.includes(m)) ordered.push(m);   // 未知の種別も落とさない
  return ordered;
}

function aggHistory(mode = histMode){
  const map = new Map();
  for(const r of histRecords(mode)){
    const k = norm(r.title) + ' ' + norm(r.artist);
    let e = map.get(k);
    if(!e){ e = { key:k, title:r.title, artist:r.artist, count:0, lastAt:null, best:null, bestRaw:null, modeSet:new Set() }; map.set(k, e); }
    e.count++;
    if(r.date && (!e.lastAt || r.date > e.lastAt)) e.lastAt = r.date;
    if(r.score != null && (e.best == null || r.score > e.best)) e.best = r.score;
    if(r.rawScore != null && (e.bestRaw == null || r.rawScore > e.bestRaw)) e.bestRaw = r.rawScore;
    if(r.mode) e.modeSet.add(r.mode);
    if(!e.artist && r.artist) e.artist = r.artist;
  }
  const owned = new Set(songs.map(s => norm(s.title) + ' ' + norm(s.artist)));
  const ownedTitles = new Set(songs.map(s => norm(s.title)));
  for(const e of map.values()){
    e.inMemo = owned.has(e.key) || ownedTitles.has(norm(e.title));
    e.modes = [...e.modeSet]; delete e.modeSet;
  }
  return [...map.values()];
}

/* =========================================================
   音名（DAM表記）とMIDIノート番号の相互変換
   lowlowC / lowC / mid1C / mid2C / hiC / hihiC … mid2C が中央ド(C4)
   ========================================================= */
const NOTE_IDX = { C:0, 'C#':1, D:2, 'D#':3, E:4, F:5, 'F#':6, G:7, 'G#':8, A:9, 'A#':10, B:11 };
const OCTAVES  = { lowlow:1, low:2, mid1:3, mid2:4, hi:5, hihi:6 };
const OCT_NAME = ['lowlow','low','mid1','mid2','hi','hihi'];
const NOTE_NAME = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

/** "mid2G#" のような表記を MIDI番号に。読めなければ null */
function parseNote(s){
  const m = String(s ?? '').trim().match(/^(hihi|hi|mid1|mid2|lowlow|low)\s*([A-G])\s*(#|♯)?$/i);
  if(!m) return null;
  const oct = OCTAVES[m[1].toLowerCase()];
  const idx = NOTE_IDX[m[2].toUpperCase() + (m[3] ? '#' : '')];
  if(oct == null || idx == null) return null;
  return (oct + 1) * 12 + idx;
}
function noteName(midi){
  if(midi == null) return '—';
  const oct = Math.floor(midi / 12) - 1;
  const name = OCT_NAME[oct - 1];
  return (name || 'oct' + oct) + NOTE_NAME[midi % 12];
}

/* DAMは声域をMIDIノート番号で返す（68 → mid2G#） */

/* =========================================================
   声域の分析 → 新規メモのキー設定を助ける
   ・DAMが音域を返していれば、実測の声域を出す
   ・返していなくても、マイメモのキー設定の傾向からは助言できる
   ========================================================= */
function median(nums){
  if(!nums.length) return null;
  const a = [...nums].sort((x, y) => x - y);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : Math.round((a[m-1] + a[m]) / 2);
}

function analyzeVoice(){
  const highs = [], lows = [];
  // 実際に歌ったキーと、そのときの得点。歌ったキー基準で見るのが正確
  const sungKeys = [], keyScore = [];

  for(const r of history){
    const d = r.detail; if(!d) continue;
    if(d.range){
      if(d.range.high != null) highs.push(d.range.high);
      if(d.range.low  != null) lows.push(d.range.low);
    }
    if(d.key != null){
      sungKeys.push(d.key);
      if(r.score != null) keyScore.push({ key:d.key, score:r.score });
    }
  }

  // マイメモのキー設定は、その人が「歌いやすい」と判断した結果
  const memoKeys = songs.map(s => Number(s.key) || 0);

  // キーを下げたときと上げたときで、点数に差が出ているか
  const down = keyScore.filter(x => x.key < 0), up = keyScore.filter(x => x.key > 0), flat = keyScore.filter(x => x.key === 0);
  const avg = a => a.length ? a.reduce((t, x) => t + x.score, 0) / a.length : null;

  return {
    hasRange: highs.length > 0 || lows.length > 0,
    samples: Math.max(highs.length, lows.length),
    highest: highs.length ? Math.max(...highs) : null,
    lowest:  lows.length  ? Math.min(...lows)  : null,
    highTypical: median(highs),          // 「たまに出た」最高音に引っ張られないよう中央値も見る
    lowTypical:  median(lows),
    sungKeyCount: sungKeys.length,
    sungKeyMedian: median(sungKeys),
    keyCount: memoKeys.length,
    keyMedian: median(memoKeys),
    keyMin: memoKeys.length ? Math.min(...memoKeys) : null,
    keyMax: memoKeys.length ? Math.max(...memoKeys) : null,
    scoreByKey: { down:avg(down), flat:avg(flat), up:avg(up), n:keyScore.length },
  };
}

/* =========================================================
   音域どうしを突き合わせてキーを決める
   ・自分の声域   … 歌唱履歴の singingRange の分布から
   ・曲の音域     … 歌唱履歴（原曲キーに戻す）／手入力
   ========================================================= */
function percentile(nums, p){
  if(!nums.length) return null;
  const a = [...nums].sort((x, y) => x - y);
  return a[Math.max(0, Math.min(a.length - 1, Math.round((a.length - 1) * p)))];
}

/**
 * 自分が実際に出している音の分布。
 * 一度きりの最高音に引っ張られないよう、上下1割を外した値も持つ
 */
function myVocalRange(){
  const highs = [], lows = [];
  for(const r of history){
    const g = r.detail && r.detail.range;
    if(!g) continue;
    if(g.high != null) highs.push(g.high);
    if(g.low  != null) lows.push(g.low);
  }
  return {
    n: highs.length,
    max: highs.length ? Math.max(...highs) : null,
    min: lows.length  ? Math.min(...lows)  : null,
    comfortHigh: percentile(highs, 0.9),   // 無理なく届く上限
    comfortLow:  percentile(lows, 0.1),
  };
}

/**
 * 曲ごとの「原曲キーでの音域」。
 * DAMが記録するのは歌ったときの音域なので、そのときのキー分を戻す
 */
function songRangeIndex(){
  const map = new Map();
  for(const r of history){
    const d = r.detail;
    if(!d || !d.range || d.range.high == null || d.range.low == null) continue;
    const k = d.key || 0;
    const id = norm(r.title) + '|' + norm(r.artist);
    let e = map.get(id);
    if(!e){ e = { title:r.title, artist:r.artist, highs:[], lows:[] }; map.set(id, e); }
    e.highs.push(d.range.high - k);
    e.lows.push(d.range.low - k);
  }
  for(const e of map.values()){
    // 途中で歌うのをやめた回は音域が狭く出るので、広いほうを採る
    e.high = Math.max(...e.highs);
    e.low  = Math.min(...e.lows);
    e.takes = e.highs.length;
    e.src = 'history';
  }
  return map;
}
let _rangeIdx = null;
function songRangeOf(title, artist){
  const id = norm(title) + '|' + norm(artist);
  const manual = songRanges[id];
  if(manual) return { ...manual, src:'manual' };
  if(!_rangeIdx) _rangeIdx = songRangeIndex();
  return _rangeIdx.get(id) || null;
}
function invalidateRangeIndex(){ _rangeIdx = null; }

/**
 * 曲の音域と自分の声域を突き合わせて、収まるキーを求める。
 * 上げ下げの余地を [lo, hi] で出し、その中で0に最も近い値を選ぶ
 */
function keyFromRange(title, artist){
  const song = songRangeOf(title, artist);
  const me = myVocalRange();
  if(!song || me.comfortHigh == null || me.comfortLow == null) return null;

  const lo = me.comfortLow  - song.low;    // これより下げると低音が出ない
  const hi = me.comfortHigh - song.high;   // これより上げると高音が出ない
  const fits = lo <= hi;
  let key = fits ? Math.max(lo, Math.min(hi, 0)) : Math.round((lo + hi) / 2);
  key = Math.max(-12, Math.min(12, Math.round(key)));

  return {
    key, fits, song, me,
    width: song.high - song.low,
    myWidth: me.comfortHigh - me.comfortLow,
    // 収まらない＝曲の音域が自分の声域より広い
    over: fits ? 0 : (song.high - song.low) - (me.comfortHigh - me.comfortLow),
  };
}

/**
 * 新しくメモを作るときの推奨キー。
 * 同じ曲 → 同じアーティスト → 全体、の順に根拠の強いものを使う
 */
function suggestKeyFor(title, artist){
  const t = norm(title), a = norm(artist);

  const same = songs.find(s => norm(s.title) === t && (!a || !s.artist || norm(s.artist) === a));
  if(same) return { key:Number(same.key) || 0, reason:'この曲は既にメモ済みです', strong:true };

  // 同じ曲を実際に歌っていれば、そのときのキーが最も確かな根拠
  const sung = history.filter(r => norm(r.title) === t && r.detail && r.detail.key != null);
  if(sung.length){
    const best = sung.reduce((x, y) => (y.score ?? -1) > (x.score ?? -1) ? y : x);
    return {
      key: best.detail.key,
      reason: `この曲は ${fmtKey(best.detail.key)} で歌って${best.score != null ? ` ${best.score.toFixed(3)}点` : 'います'}`,
      strong: true,
    };
  }

  // 曲の音域が分かっていれば、自分の声域と突き合わせて算出する
  const ra = keyFromRange(title, artist);
  if(ra){
    return {
      key: ra.key,
      reason: ra.fits
        ? `曲の音域 ${noteName(ra.song.low)}〜${noteName(ra.song.high)} をあなたの声域に合わせると ${fmtKey(ra.key)}`
        : `曲の音域が ${ra.over} 半音ぶん広く、どのキーでも収まりません（${fmtKey(ra.key)} が最も無理が少ない）`,
      strong: ra.fits,
      range: ra,
    };
  }

  if(a){
    const ks = songs.filter(s => norm(s.artist) === a).map(s => Number(s.key) || 0);
    if(ks.length >= 2){
      const k = median(ks);
      return { key:k, reason:`${artist} の${ks.length}曲は中央値 ${fmtKey(k)}`, strong:true };
    }
    if(ks.length === 1) return { key:ks[0], reason:`${artist} の曲では ${fmtKey(ks[0])} にしています`, strong:false };
  }

  const all = songs.map(s => Number(s.key) || 0);
  if(all.length >= 3){
    const k = median(all);
    return { key:k, reason:`あなたの設定キーの中央値は ${fmtKey(k)}`, strong:false };
  }
  return { key:0, reason:'', strong:false };
}

/* 履歴レコードの重複判定キー（採点IDがあれば優先） */
function histSig(r){
  if(r.scoringId) return 'sid:' + r.scoringId;
  return norm(r.title) + '|' + norm(r.artist) + '|' + (r.date || '');
}

/* =========================================================
   DAM★とも 精密採点履歴の自動取得
   取得口は2通り: ローカルサーバー(server.js) か proxy(Cloudflare Worker等)
   ・同一オリジンに /api/health があれば 'local'
   ・無ければ proxyUrl が設定されていれば 'proxy'
   ========================================================= */
async function detectBackend(){
  proxyAlive = null;
  try{
    const r = await fetch('/api/health', { cache:'no-store' });
    if(r.ok && (await r.json()).status === 'ok'){ backendMode = 'local'; if(view === 'history') render(); return; }
  }catch{}

  backendMode = proxyUrl ? 'proxy' : 'none';
  if(view === 'history') render();
  if(backendMode !== 'proxy') return;

  // proxyが本当に生きているか確かめる（未デプロイのWorkerを掴んだままにしない）
  proxyAlive = await pingProxy();
  if(view === 'history') render();
}

/** damtomoIdなしで叩くと、生きているWorkerは即座にJSONを返す＝疎通確認になる */
async function pingProxy(){
  try{
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(proxyUrl, { signal:ctl.signal, cache:'no-store' });
    clearTimeout(to);
    if(!r.ok) return false;
    await r.json();          // JSONでなければWorkerではない
    return true;
  }catch{ return false; }
}

/** fetch が通信レベルで失敗したか（CORS / DNS / 未デプロイなど） */
function isNetworkError(err){
  return err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(err.message || '');
}

/* 取得先URLを組み立てる（local: 同一オリジンAPI / proxy: Worker等） */
function historyUrl(damtomoId){
  const q = 'damtomoId=' + encodeURIComponent(damtomoId);
  if(backendMode === 'local') return '/api/damtomo/history?' + q;
  if(backendMode === 'proxy' && proxyUrl) return proxyUrl + (proxyUrl.includes('?') ? '&' : '?') + q;
  return null;
}

async function fetchDamHistory(btn){
  if(!dam || !dam.damtomoId){ toast('先にDAM★ともアカウントを登録してください'); return; }
  const setMsg = t => { const m = document.getElementById('dam-fetch-msg'); if(m) m.textContent = t; };
  const url = historyUrl(dam.damtomoId);
  if(!url){ toast('取得サーバー(proxy)のURLを設定してください'); setMsg('取得サーバーが未設定です。下の欄にproxyのURLを保存してください。'); return; }
  if(btn){ btn.disabled = true; btn.textContent = '取得中…'; }
  setMsg('DAM★ともから精密採点履歴を取得中…（曲数が多いと少し時間がかかります）');
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(`取得サーバーが ${res.status} ${res.statusText || ''} を返しました`.trim());
    const ct = res.headers.get('content-type') || '';
    if(!ct.includes('json')) throw new Error('取得サーバーがJSON以外を返しました。URLがWorkerのものか確認してください。');
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const recs = Array.isArray(data.records) ? data.records : [];
    if(!recs.length){
      setMsg(data.message || '履歴が見つかりませんでした。'); toast('新しい履歴はありませんでした');
      if(btn){ btn.disabled = false; btn.textContent = FETCH_LABEL; }
      return;
    }

    const bySig = new Map(history.map(r => [histSig(r), r]));
    let added = 0, enriched = 0;
    for(const r of recs){
      const title = String(r.title || '').trim();
      if(!title) continue;
      const rec = {
        id: uid(),
        scoringId: r.id || null,
        title,
        artist: String(r.artist || '').trim(),
        date: parseDate(r.sungAt),
        score: r.score != null ? r.score : null,
        rawScore: r.rawScore != null ? r.rawScore : null,
        bonus: r.bonus != null ? r.bonus : null,
        mode: r.mode || null,
        detail: r.detail || null,
      };
      const sig = histSig(rec);
      const old = bySig.get(sig);
      if(old){
        // 既にある歌唱でも、内訳が後から取れたなら足しておく
        if(!old.detail && rec.detail){ old.detail = rec.detail; enriched++; }
        continue;
      }
      bySig.set(sig, rec); history.push(rec); added++;
    }
    lastFetch = Date.now();
    try{ localStorage.setItem(LS_FETCH, JSON.stringify(lastFetch)); }catch{}
    invalidateRangeIndex();          // 履歴が増えたので曲の音域を作り直す
    save(); render();
    const parts = [];
    if(added)    parts.push(`${added} 件を取り込みました`);
    if(enriched) parts.push(`${enriched} 件に採点の内訳を追加しました`);
    toast(parts.length ? parts.join(' / ') : `取得済みでした（${recs.length}件を確認）`);

    // 一部の採点種別だけ取れないことがある。黙って欠けたままにしない
    const byMode = data.counts ? Object.entries(data.counts).map(([m, n]) => `${m} ${n}件`).join('　') : '';
    const failed = Array.isArray(data.errors) ? data.errors : [];
    setMsg(
      `${recs.length} 件を取得${byMode ? `（${byMode}）` : ''}。` +
      (failed.length ? `　取得できなかった種別があります → ${failed.join(' / ')}` : '')
    );
    if(btn){ btn.disabled = false; btn.textContent = FETCH_LABEL; }
  }catch(err){
    if(isNetworkError(err)){
      // 「Failed to fetch」はブラウザが理由を隠すので、考えられる原因を出しておく
      proxyAlive = false;
      setMsg(backendMode === 'proxy'
        ? `取得サーバー(proxy)に接続できませんでした（${proxyUrl}）。Cloudflare Worker が未デプロイか、URLが違う可能性があります。下の「取得サーバー(proxy)の設定」を確認してください。`
        : 'ローカルサーバーに接続できませんでした。node server.js が動いているか確認してください。');
      toast('取得サーバーに接続できません');
    } else {
      setMsg('取得に失敗しました: ' + err.message);
      toast('取得に失敗しました');
    }
    if(btn){ btn.disabled = false; btn.textContent = FETCH_LABEL; }
  }
}

function filterList(list){
  const q = norm(query);
  return list.filter(x => {
    if(view === 'memo'){
      if(favOnly && !x.fav) return false;
      if(artistFilter && norm(x.artist || '(未設定)') !== norm(artistFilter)) return false;
    }
    if(!q) return true;
    return norm(x.title).includes(q) || norm(x.artist).includes(q) || norm(x.memo).includes(q);
  });
}

/* ---- 声域とキーの傾向 ---- */
function voicePanel(){
  if(!history.length && !songs.length) return '';
  const v = analyzeVoice();
  const sk = v.scoreByKey;

  const rangeCells = v.hasRange ? `
      <div class="vcell"><span>最高音</span><b>${noteName(v.highest)}</b></div>
      <div class="vcell"><span>最低音</span><b>${noteName(v.lowest)}</b></div>
      <div class="vcell"><span>音域</span><b>${v.highest != null && v.lowest != null ? (v.highest - v.lowest) + '半音' : '—'}</b></div>
      <div class="vcell"><span>ふだんの最高音</span><b>${noteName(v.highTypical)}</b></div>` : '';

  const keyCells = `
      ${v.sungKeyCount ? `<div class="vcell"><span>よく歌うキー</span><b>${fmtKey(v.sungKeyMedian)}</b></div>` : ''}
      ${v.keyCount ? `
      <div class="vcell"><span>メモの設定キー</span><b>${fmtKey(v.keyMedian)}</b></div>
      <div class="vcell"><span>キーの幅</span><b>${fmtKey(v.keyMin)} 〜 ${fmtKey(v.keyMax)}</b></div>` : ''}`;

  const kbd = v.hasRange && v.lowest != null && v.highest != null
    ? `<div style="margin:2px 0 12px">${keyboardRange(v.lowest, v.highest)}</div>` : '';

  // 「キーを下げた曲のほうが点が高い」なら、それは有用な助言になる
  let advice = '';
  if(sk.n >= 3 && sk.down != null && (sk.flat != null || sk.up != null)){
    const other = sk.flat != null ? sk.flat : sk.up;
    const diff = sk.down - other;
    if(Math.abs(diff) >= 0.3){
      advice = diff > 0
        ? `キーを下げた曲のほうが平均 ${diff.toFixed(2)}点 高く出ています。迷ったら下げ方向が無難です。`
        : `キーを下げた曲のほうが平均 ${(-diff).toFixed(2)}点 低く出ています。下げすぎかもしれません。`;
    }
  }

  const note = v.hasRange
    ? `${v.samples} 回分の採点データ（DAMが記録した実測の声域）から算出しています。`
    : `取り込んだ採点データに声域の項目がまだありません。「⟳ 精密採点履歴を取得」を押すと追加されます。
       いまはマイメモのキー設定${v.keyCount ? `（${v.keyCount}曲）` : ''}から傾向を出しています。`;

  if(!rangeCells.trim() && !keyCells.trim()) return '';

  return `
    <div class="panel">
      <h3>あなたの声域とキーの傾向</h3>
      ${kbd}
      <div class="voice">${rangeCells}${keyCells}</div>
      ${advice ? `<div class="vcell wide" style="margin-bottom:10px"><span>傾向</span><b style="font-size:13px;font-weight:700">${esc(advice)}</b></div>` : ''}
      <p class="note" style="margin:0">${note}<br>
        新しく曲を追加するときは、入力欄の下に推奨キーが出ます。</p>
    </div>`;
}

/* 取得した歌唱日（"2026-07-28" や "2026年7月28日" など）をミリ秒に直す */
function parseDate(s){
  if(!s) return null;
  const t = String(s).replace(/年|\//g,'-').replace(/月/g,'-').replace(/日/g,' ').trim();
  const m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]).getTime();
  const p = Date.parse(t);
  return isNaN(p) ? null : p;
}

/* AiHeart は「聴感」を含む6角形。Ai / DX-G は聴感がないので5角形 */
const RADAR_6 = [
  ['pitch','音程'], ['stability','安定性'], ['expressive','表現力'],
  ['hearing','聴感'], ['rhythm','リズム'], ['vibratoLongtone','ビブラート\nロングトーン'],
];
const RADAR_5 = [
  ['pitch','音程'], ['stability','安定性'], ['expressive','表現力'],
  ['rhythm','リズム'], ['vibratoLongtone','ビブラート\nロングトーン'],
];
function radarAxes(mode, radar){
  if(mode === '精密採点AiHeart') return RADAR_6;
  if(mode === '精密採点Ai' || mode === '精密採点DX-G') return RADAR_5;
  return radar && radar.hearing != null ? RADAR_6 : RADAR_5;   // 未知の種別だけデータで判断
}
const COUNT_LABELS = {
  shakuri:'しゃくり', kobushi:'こぶし', fall:'フォール', accent:'アクセント',
  hammeringOn:'ハンマリング', pullingOff:'プリング', edgeVoice:'エッジボイス',
  hiccup:'ヒーカップ', flydown:'フライダウン',
};
// 画面で確認できた値のみ名前を当てる。未確認の値は番号のまま出す
const VIBRATO_TYPES = { 6:'ボックス形' };
const HEART_TYPES   = { 3:'パワフル＆スマイル' };

/** N角形のレーダーチャート。本人＝実線、全国平均＝点線 */
function radarSvg(radar, avg, axes){
  const N = axes.length;
  const R = 50;
  // 図形の外にラベルを置くので、その分の余白を左右に広く取る
  const cx = 108, cy = 88, W = 216, H = 176;
  const LR = R * 1.34;                    // ラベルを置く半径（図形より外）
  const LH = 9.4;                         // 行送り

  const at = (i, r) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / N;   // 頂点をひとつ真上に置く
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const pt = (i, v) => at(i, R * Math.max(0, Math.min(100, v ?? 0)) / 100);
  const ring = p => axes.map((_, i) => pt(i, p).map(n => n.toFixed(1)).join(',')).join(' ');
  const poly = vals => axes.map(([k], i) => pt(i, vals?.[k]).map(n => n.toFixed(1)).join(',')).join(' ');

  const web = [100, 75, 50, 25].map(p => `<polygon points="${ring(p)}" class="rw"/>`).join('');
  const spokes = axes.map((_, i) => {
    const [x, y] = at(i, R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rw"/>`;
  }).join('');

  const labels = axes.map(([k, label], i) => {
    const [x, y] = at(i, LR);
    const lines = label.split('\n');
    const rows = lines.length + 1;                    // 軸名 + 数値

    // 図形に被らないよう、軸の向きに応じて外側へ逃がす
    const anchor = x > cx + 2 ? 'start' : (x < cx - 2 ? 'end' : 'middle');
    const dx = x > cx + 2 ? 4 : (x < cx - 2 ? -4 : 0);
    let top;
    if(y < cy - 4)      top = y - (rows - 1) * LH - 2;  // 上側の軸はブロックを上へ
    else if(y > cy + 4) top = y + LH;                   // 下側の軸は下へ
    else                top = y - (rows - 1) * LH / 2 + 3;

    const tx = (x + dx).toFixed(1);
    return lines.map((ln, j) =>
        `<text x="${tx}" y="${(top + j * LH).toFixed(1)}" text-anchor="${anchor}" class="rl">${esc(ln)}</text>`).join('') +
      `<text x="${tx}" y="${(top + lines.length * LH).toFixed(1)}" text-anchor="${anchor}" class="rv">${radar?.[k] ?? '—'}</text>`;
  }).join('');

  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="採点レーダーチャート（${N}項目）">
    ${web}${spokes}
    ${avg ? `<polygon points="${poly(avg)}" class="ravg"/>` : ''}
    <polygon points="${poly(radar)}" class="rme"/>
    ${labels}
  </svg>`;
}

/** 24区間のグラフ。kinds が 2 の区間はサビとして色を変える */
function sectionGraph(values, kinds, cls){
  if(!values) return '';
  const bars = values.map((v, i) => {
    const kind = kinds ? kinds[i] : 1;
    if(kind === 0) return '<div class="sgap"></div>';          // 演奏していない区間
    return `<div class="sbar ${kind === 2 ? 'sabi' : ''}" style="height:${Math.max(2, v ?? 0)}%" title="区間${i+1}: ${v ?? '—'}"></div>`;
  }).join('');
  return `<div class="sgraph ${cls || ''}">${bars}</div>`;
}

function meter(value, max, left, right){

  return `<div class="meter">

      <div class="mtrack"><i style="left:${p.toFixed(1)}%"></i></div>

}

  return `<span class="dots">${[0,1,2,3,4].map(i => `<i class="${i < filled ? 'on' : ''}"></i>`).join('')}</span>
          <span class="dnum">${v}/${max}</span>`;

/** 声域を鍵盤で示す。low〜high を塗り、前後に余白の鍵盤を置く */
function keyboardRange(low, high){
  if(low == null || high == null) return '';
  const from = Math.max(0, low - 4), to = Math.min(127, high + 4);
  const isBlack = n => [1,3,6,8,10].includes(n % 12);
  const whites = [];
  for(let n = from; n <= to; n++) if(!isBlack(n)) whites.push(n);
  const w = 100 / whites.length;

  const whiteKeys = whites.map((n, i) =>
    `<div class="wk ${n >= low && n <= high ? 'in' : ''} ${n === low || n === high ? 'edge' : ''}"
          style="left:${(i * w).toFixed(3)}%;width:${w.toFixed(3)}%"></div>`).join('');

  const blackKeys = [];
  for(let n = from; n <= to; n++){
    if(!isBlack(n)) continue;
    const leftWhite = whites.filter(x => x < n).length;      // 直前の白鍵の数＝位置
    if(leftWhite === 0 || leftWhite >= whites.length) continue;
    blackKeys.push(`<div class="bk ${n >= low && n <= high ? 'in' : ''} ${n === low || n === high ? 'edge' : ''}"
      style="left:${(leftWhite * w - w * 0.3).toFixed(3)}%;width:${(w * 0.6).toFixed(3)}%"></div>`);
  }

  return `<div class="kbd">${whiteKeys}${blackKeys.join('')}</div>
    <div class="kbd-lab"><b>${noteName(low)}</b> 〜 <b>${noteName(high)}</b>（${high - low} 半音）</div>`;
}

/** 歌唱1回分のカード */
function takeHtml(t){
  const d = t.detail;
  const sc = t.score != null ? t.score.toFixed(3) : '—';

  const header = `
    <div class="take-h">
      <span class="take-date">${fmtDate(t.date)}</span>
      <span class="mchip">${esc(t.mode || '—')}</span>
      <span class="take-score">${sc}<small>点</small></span>
    </div>
    <div class="take-meta">
      ${t.bonus != null ? `<span>素点 ${t.rawScore != null ? t.rawScore.toFixed(3) : '—'} ＋ボーナス ${t.bonus.toFixed(3)}</span>` : ''}
      ${d?.nationalAvg != null ? `<span>全国平均 ${d.nationalAvg.toFixed(3)}</span>` : ''}
      ${d?.maxScore != null ? `<span>自己最高 ${d.maxScore.toFixed(3)}</span>` : ''}
      ${d?.rank != null ? `<span>月次 ${d.rank}位 / ${d.rankAll ?? '—'}人</span>` : ''}
      ${d?.key != null ? `<span class="keychip">キー ${fmtKey(d.key)}</span>` : ''}
    </div>`;

  if(!d) return `<div class="take">${header}<div class="take-sub">
    この歌唱には内訳データがありません。「⟳ 精密採点履歴を取得」を押すと、
    いま取得できる種別のぶんは追加されます。それでも出ない場合は、
    DAM★とも側がこの採点の詳細を返していません。</div></div>`;

  const counts = d.counts ? Object.entries(d.counts).filter(([, v]) => v > 0) : [];

  return `<div class="take">
    ${header}
    ${d.radar ? `<div class="sec radar-wrap">
      ${radarSvg(d.radar, d.avgRadar, radarAxes(t.mode, d.radar))}
      ${d.avgRadar ? '<div class="legend"><i class="me"></i>あなた<i class="avg"></i>全国平均</div>' : ''}
    </div>` : ''}

    ${d.pitchGraph ? `<div class="sec">
      <div class="sech">音程<b>${d.radar?.pitch != null ? d.radar.pitch + '%' : ''}</b><span>演奏区間ごとの音程正確率（濃い色はサビ）</span></div>
      ${sectionGraph(d.pitchGraph, d.pitchIndex)}
    </div>` : ''}

    ${(d.intonation != null || counts.length) ? `<div class="sec">
      <div class="sech">表現力<b>${d.radar?.expressive != null ? d.radar.expressive + '点' : ''}</b>${d.intonation != null ? `<span>抑揚 ${d.intonation}点</span>` : ''}</div>
      ${counts.length ? `<div class="chips">${counts.map(([k, v]) =>
        `<span class="cchip">${esc(COUNT_LABELS[k] || k)}<b>${v}</b></span>`).join('')}</div>` : ''}
    </div>` : ''}

    ${d.hearGraph ? `<div class="sec">
      <div class="sech">聴感<b>${d.radar?.hearing != null ? d.radar.hearing + '点' : ''}</b><span>区間ごとの聴感評価</span></div>
      ${sectionGraph(d.hearGraph, d.hearIndex, 'hear')}
    </div>` : ''}

    ${(d.longtone || d.vibrato) ? `<div class="sec twocol">
      ${d.longtone ? `<div class="sub">
        <div class="subh">ロングトーン</div>
        <div class="subrow">上手さ ${skillDots(d.longtone.skill ?? 0)}</div>
        ${d.longtone.count != null ? `<div class="subrow dim">${d.longtone.count} 回</div>` : ''}
      </div>` : ''}
      ${d.vibrato ? `<div class="sub">
        <div class="subh">ビブラート</div>
        <div class="subrow">上手さ ${skillDots(d.vibrato.skill ?? 0)}</div>
        <div class="subrow dim">
          ${d.vibrato.totalSec != null ? `合計 ${d.vibrato.totalSec.toFixed(1)}秒　` : ''}
          ${d.vibrato.count != null ? `${d.vibrato.count} 回　` : ''}
          ${d.vibrato.type != null ? `タイプ ${VIBRATO_TYPES[d.vibrato.type] || d.vibrato.type}` : ''}
        </div>
      </div>` : ''}
    </div>` : ''}

    ${(d.radar?.stability != null || d.timing != null) ? `<div class="sec twocol">
      ${d.radar?.stability != null ? `<div class="sub">
        <div class="subh">安定性 <b>${d.radar.stability}点</b></div>
        ${meter(d.radar.stability, 100, '震えがち', 'まっすぐ')}
      </div>` : ''}
      ${d.timing != null ? `<div class="sub">
        <div class="subh">リズム <b>${d.radar?.rhythm != null ? d.radar.rhythm + '点' : ''}</b></div>
        ${meter(d.timing, 8, 'タメ', '走り')}
      </div>` : ''}
    </div>` : ''}

    ${d.range && d.range.low != null ? `<div class="sec">
      <div class="sech">声域</div>
      ${keyboardRange(d.range.low, d.range.high)}
    </div>` : ''}

    ${d.hearingType != null ? `<div class="take-sub">ハートタイプ：${esc(HEART_TYPES[d.hearingType] || 'タイプ ' + d.hearingType)}</div>` : ''}
  </div>`;
}

/* =========================================================
   左スワイプで削除ボタンを出す（モバイルのマイメモ）
   ========================================================= */
const SWIPE_W = 92;        // CSS の .swipe-del の幅と揃える
let swipeMoved = false;    // 直前がスワイプなら、続けて発火するクリックは無視する

function closeSwipes(except){
  document.querySelectorAll('.swipe.open').forEach(el => { if(el !== except) el.classList.remove('open'); });
}

function attachSwipe(root){
  let el = null, inner = null, x0 = 0, y0 = 0, dx = 0, base = 0, axis = null;

  root.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    const s = e.target.closest('.swipe');
    closeSwipes(s);                                   // 他の行が開いていたら閉じる
    if(!s) return;
    el = s; inner = s.querySelector('.swipe-inner');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    base = dx = s.classList.contains('open') ? -SWIPE_W : 0;
    axis = null;
  }, { passive:true });

  root.addEventListener('touchmove', e => {
    if(!el) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if(!axis){
      if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;     // まだ方向が定まらない
      if(Math.abs(my) >= Math.abs(mx)){ el = null; return; } // 縦スクロールに譲る
      axis = 'x'; el.classList.add('dragging'); swipeMoved = true;
    }
    e.preventDefault();                                    // 横スワイプ中はスクロールさせない
    dx = Math.max(-SWIPE_W - 24, Math.min(0, base + mx));
    inner.style.transform = `translateX(${dx}px)`;
  }, { passive:false });

  const finish = () => {
    if(!el) return;
    inner.style.transform = '';
    el.classList.remove('dragging');
    if(axis === 'x') el.classList.toggle('open', dx < -SWIPE_W / 2);
    el = null; inner = null; axis = null;
    setTimeout(() => { swipeMoved = false; }, 350);        // クリックが来なかった場合の保険
  };
  root.addEventListener('touchend', finish);
  root.addEventListener('touchcancel', finish);
}

  if(hrow){

      const rec = aggHistory().find(r => r.key === hrow.dataset.hkey); if(!rec) return;
      addSong(rec.title, rec.artist, suggestKeyFor(rec.title, rec.artist).key,
        `DAM★とも履歴より（${rec.count}回歌唱${rec.best != null ? ` / 最高 ${rec.best.toFixed(3)}点` : ''}）`);
      return;
    }
    openHistDetail(hrow.dataset.hkey);      // 行を選んだら採点の詳細へ
    return;
  }

  const row = e.target.closest('[data-id]'); if(!row) return;
  const s = songs.find(x => x.id === row.dataset.id); if(!s) return;
  const act = e.target.closest('[data-act]')?.dataset.act;

  // スワイプで出した削除は確認なし。代わりに数秒間「元に戻す」を出す
  if(act === 'swipedel'){ deleteSongWithUndo(s.id); return; }

  // スワイプで開いている行は、他をタップしたらまず閉じる
  if(row.classList.contains('open')){ row.classList.remove('open'); return; }

  if(act === 'fav'){ s.fav = !s.fav; save(); render(); return; }
  if(act === 'del'){
    if(confirm(`「${s.title}」を削除します。よろしいですか？`)){ songs = songs.filter(x => x.id !== s.id); save(); render(); toast('削除しました'); }
    return;
  }
  if(act === 'edit' || isMobile) openEdit(s.id);   // モバイルは行タップで編集
});
